<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>A simple example</title>
    <script src="https://aframe.io"></script>
</head>

<body>
<a-scene embedded>
  <a-assets>
    <video id="video-src" src="../video/WarmSphere_Sample1_injected.mp4" autoplay loop playsinline webkit-playsinline crossorigin="anonymous" width="50%" height="50%"></video>
  </a-assets>
  

  <!-- 360度動画用コンポーネント -->
  <a-videosphere src="#video-src" rotation="0 -90 0"></a-videosphere>
  <a-entity camera="active: true" look-controls wasd-controls position="0 1.6 0" data-aframe-default-camera></a-entity>
  <!-- <a-camera look-controls position="0 0 0"></a-camera> -->
  <!-- <a-camera look-controls position="0 0 0" fov="60"></a-camera> -->
</a-scene>

<script>
  // Macのブラウザでの自動再生ブロックを回避するスクリプト
  document.body.addEventListener('click', function () {
    var video = document.querySelector('#video-src');
    video.play();
  }, { once: true });
</script>
</body>
</html>
